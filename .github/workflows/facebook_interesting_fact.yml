name: Facebook Interesting Fact Downloader

on:
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Run Scraper Script
        env:
          TELEGRAM_FAILD_TOKEN: ${{ secrets.TELEGRAM_FAILD_TOKEN }}
          TELEGRAM_FAILD_ID: ${{ secrets.TELEGRAM_FAILD_ID }}
        run: |
          cd "Facebook Intresting Fact"
          python scraper.py

      - name: Commit Updated track.json to Current Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Facebook Intresting Fact/track.json"
          git commit -m "Auto-update track.json [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload Video to Postza Repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Target repo clone karna
          git clone https://x-access-token:${GH_TOKEN}@github.com/Automation8248/Postza.git target_repo
          
          # Target repo me folder create karna agar nahi hai toh
          mkdir -p "target_repo/Facebook Intresting Fact/Videos"
          
          # Video ko naye naam (timestamp) ke sath target folder me copy karna
          TIMESTAMP=$(date +%s)
          cp "Facebook Intresting Fact/video_to_upload.mp4" "target_repo/Facebook Intresting Fact/Videos/video_$TIMESTAMP.mp4"
          
          # Target repo me changes push karna
          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Facebook Intresting Fact/Videos/video_$TIMESTAMP.mp4"
          git commit -m "Upload new video via Automation"
          git push origin main
